name: Bend CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: bend-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  metadata:
    name: Changelog and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      version_changed: ${{ steps.release.outputs.version_changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate changelog and release version
        id: release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ALLOW_NO_FRAGMENT: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          args=()
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then args+=(--base-ref "$BASE_SHA"); fi
          if [[ "$ALLOW_NO_FRAGMENT" == true ]]; then args+=(--allow-no-fragment); fi
          python3 scripts/release.py check "${args[@]}"
      - name: Test release preparation and validation
        run: python3 scripts/test-release.py
      - name: Test signing credential lifecycle
        run: python3 scripts/test-ci-signing.py
      - name: Test release publication
        run: python3 scripts/test-publish-release.py

  native:
    name: macOS 26 build and tests
    needs: metadata
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - name: Test packaging scripts
        run: |
          bash scripts/test-build-app.sh
          bash scripts/test-build-prod.sh
      - name: Compile production
        run: |
          mkdir -p ci-logs
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          swift build -c release --disable-sandbox -Xswiftc -DBEND_PRODUCTION \
            -Xlinker -platform_version -Xlinker macos -Xlinker 26.0 -Xlinker "$sdk_version" \
            2>&1 | tee ci-logs/build.log
      - name: Run Swift tests
        timeout-minutes: 15
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
        run: |
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          swift test --disable-sandbox --no-parallel \
            -Xlinker -platform_version -Xlinker macos -Xlinker 26.0 -Xlinker "$sdk_version" \
            2>&1 | tee ci-logs/tests.log
      - name: Upload native logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14

  production:
    name: Signed production build
    needs: [metadata, native]
    if: >-
      needs.metadata.outputs.version_changed == 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: macos-26
    timeout-minutes: 90
    environment: release-signing
    outputs:
      dmg_artifact: ${{ steps.dmg.outputs.artifact-id }}
      details_artifact: ${{ steps.details.outputs.artifact-id }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BEND_SIGNING_IDENTITY: ${{ vars.BEND_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Allocate candidate build number
        run: |
          test "$GITHUB_RUN_ATTEMPT" -lt 1000
          echo "BEND_BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
          test -n "$BEND_SIGNING_IDENTITY"
      - name: Set up temporary signing credentials
        env:
          BEND_CERTIFICATE_P12_BASE64: ${{ secrets.BEND_CERTIFICATE_P12_BASE64 }}
          BEND_CERTIFICATE_PASSWORD: ${{ secrets.BEND_CERTIFICATE_PASSWORD }}
          BEND_NOTARY_KEY_P8: ${{ secrets.BEND_NOTARY_KEY_P8 }}
          BEND_NOTARY_KEY_ID: ${{ secrets.BEND_NOTARY_KEY_ID }}
          BEND_NOTARY_ISSUER_ID: ${{ secrets.BEND_NOTARY_ISSUER_ID }}
        run: python3 scripts/ci-signing.py setup
      - name: Build, sign, and notarize
        run: ./scripts/build-prod.sh
      - name: Prepare artifact metadata
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p release-artifacts
          cp "dist/Bend-$RELEASE_VERSION-arm64.dmg" release-artifacts/
          cp ".changes/v$RELEASE_VERSION.md" release-artifacts/RELEASE_NOTES.md
          (cd release-artifacts && shasum -a 256 "Bend-$RELEASE_VERSION-arm64.dmg" > SHA256SUMS)
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          metadata = {key: os.environ[key] for key in (
              "RELEASE_VERSION", "BEND_BUILD_NUMBER", "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")}
          metadata["sdk"] = subprocess.check_output(["xcrun", "--sdk", "macosx", "--show-sdk-version"], text=True).strip()
          pathlib.Path("release-artifacts/build.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
      - name: Upload signed DMG
        id: dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release-artifacts/Bend-${{ needs.metadata.outputs.version }}-arm64.dmg
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload candidate metadata
        id: details
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Bend-${{ needs.metadata.outputs.version }}-build-details-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-artifacts/SHA256SUMS
            release-artifacts/RELEASE_NOTES.md
            release-artifacts/build.json
          if-no-files-found: error
          retention-days: 30
      - name: Link DMG download
        env:
          DMG_URL: ${{ steps.dmg.outputs.artifact-url }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          printf '[Download Bend %s for Apple Silicon (.dmg)](%s)\n' "$RELEASE_VERSION" "$DMG_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notary-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/notary-*/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove signing credentials
        if: always()
        run: python3 scripts/ci-signing.py cleanup

  publish:
    name: Publish GitHub Release
    needs: [metadata, native, production]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.metadata.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: bend-release-${{ needs.metadata.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download this run's signed build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.production.outputs.dmg_artifact }},${{ needs.production.outputs.details_artifact }}
          path: release-artifacts
          merge-multiple: true
      - name: Create tag and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 scripts/publish-release.py release-artifacts

  status:
    name: CI
    needs: [metadata, native, production, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          METADATA: ${{ needs.metadata.result }}
          NATIVE: ${{ needs.native.result }}
          PRODUCTION: ${{ needs.production.result }}
          PUBLISH: ${{ needs.publish.result }}
          RELEASE_REQUIRED: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.metadata.outputs.version_changed == 'true' }}
          PUBLISH_REQUIRED: ${{ github.event_name == 'push' && needs.metadata.outputs.version_changed == 'true' }}
        run: |
          test "$METADATA" = success
          test "$NATIVE" = success
          if [[ "$RELEASE_REQUIRED" == true ]]; then
            test "$PRODUCTION" = success
          fi
          if [[ "$PUBLISH_REQUIRED" == true ]]; then
            test "$PUBLISH" = success
          fi
