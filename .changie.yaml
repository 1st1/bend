changesDir: .changes
unreleasedDir: unreleased
changelogPath: CHANGELOG.md
headerPath: header.md
versionExt: md
versionFormat: '## {{.Version}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
kinds:
  - label: Added
  - label: Changed
  - label: Fixed
  - label: Removed
  - label: Security
body:
  minLength: 10
newlines:
  afterChangelogHeader: 1
  beforeChangelogVersion: 1
  endOfVersion: 1
